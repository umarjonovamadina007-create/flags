<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>Where in the world?</header>

<main>
    <input id="search" type="text" placeholder="Search for a country...">

    <div class="flags">

      <div class="flag" data-name="germany">
        <img src="https://flagcdn.com/w640/de.png">
        <h3>Germany</h3>
      </div>

      <div class="flag" data-name="usa">
        <img src="https://flagcdn.com/w640/us.png">
        <h3>USA</h3>
      </div>

      <div class="flag" data-name="brazil">
        <img src="https://flagcdn.com/w640/br.png">
        <h3>Brazil</h3>
      </div>

      <div class="flag" data-name="iceland">
        <img src="https://flagcdn.com/w640/is.png">
        <h3>Iceland</h3>
      </div>

      <div class="flag" data-name="afghanistan">
        <img src="https://flagcdn.com/w640/af.png">
        <h3>Afghanistan</h3>
      </div>

      <div class="flag" data-name="aland islands">
        <img src="https://flagcdn.com/w640/ax.png">
        <h3>Åland Islands</h3>
      </div>

      <div class="flag" data-name="albania">
        <img src="https://flagcdn.com/w640/al.png">
        <h3>Albania</h3>
      </div>

      <div class="flag" data-name="algeria">
        <img src="https://flagcdn.com/w640/dz.png">
        <h3>Algeria</h3>
      </div>

    </div>
  </main>

</body>
</html>
